<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis SNBT - Sukses PTN Al Bayan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#059669', primaryDark: '#047857', background: '#F8FAFC' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .accordion-row { transition: all 0.3s ease; }
        .accordion-detail { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.5s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .accordion-detail.open { 
            max-height: 2500px;
            opacity: 1; 
        }
        .rotate-icon { transition: transform 0.3s ease; }
        .rotate-icon.open { transform: rotate(180deg); }
        .subtes-card { transition: transform 0.2s ease; }
        .subtes-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-background text-slate-800 antialiased min-h-screen">

    <header class="bg-white shadow-sm border-b border-slate-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-primary text-white p-2 rounded-lg">
                    <i data-lucide="target" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold">Analisis SNBT</h1>
                    <p class="text-xs text-slate-500">Database Kelulusan</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:py-8">
        
        <!-- Filter -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Cari PTN</label>
                    <input type="text" id="searchPTN" placeholder="Contoh: Unpad" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-primary outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Cari Jurusan</label>
                    <input type="text" id="searchProdi" placeholder="Contoh: Kedokteran" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-primary outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Jenjang</label>
                    <select id="filterJenjang" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-primary outline-none text-sm">
                        <option value="">Semua Jenjang</option>
                        <option value="D3">D3</option>
                        <option value="D4">D4</option>
                        <option value="S1">S1</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Data Table dengan Accordion -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="table" class="w-5 h-5 text-primary"></i>
                    <h3 class="text-lg font-bold">Data Kelulusan per Jurusan</h3>
                </div>
                <span id="resultCount" class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium">0 jurusan</span>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="p-12 text-center">
                <div class="animate-spin w-10 h-10 border-4 border-emerald-200 border-t-primary rounded-full mx-auto mb-4"></div>
                <p class="text-slate-500">Memuat data...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden p-12 text-center">
                <i data-lucide="search-x" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                <p class="text-slate-500">Tidak ada data yang cocok dengan pencarian</p>
            </div>

            <!-- Table Content -->
            <div id="tableContent" class="hidden">
                <div class="hidden md:grid md:grid-cols-12 gap-4 px-5 py-3 bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-600 uppercase tracking-wide">
                    <div class="md:col-span-1">No</div>
                    <div class="md:col-span-3">PTN</div>
                    <div class="md:col-span-4">Jurusan</div>
                    <div class="md:col-span-2">Jenjang</div>
                    <div class="md:col-span-1 text-center">Rata-rata</div>
                    <div class="md:col-span-1 text-right">Aksi</div>
                </div>

                <div id="rowsContainer" class="divide-y divide-slate-100"></div>
            </div>
        </div>
    </main>

    <script>
        // ===== GANTI URL INI DENGAN URL DEPLOYMENT APPS SCRIPT ANDA =====
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwu6RenOGZK7cmkWMElsK8QbiGzoZIWKA69wLCSSR9HWF3DK7j2Uy1ffYvKh1HTsbwj2w/exec";
        
        let allData = [];
        let expandedRow = null;

        // URUTAN SUBTES TETAP (sesuai permintaan)
        const URUTAN_SUBTES = [
            "PENALARAN UMUM",
            "PENGETAHUAN DAN PEMAHAMAN UMUM",
            "PEMAHAMAN BACAAN DAN MENULIS",
            "PENGETAHUAN KUANTITATIF",
            "LITERASI BAHASA INDONESIA",
            "LITERASI BAHASA INGGRIS",
            "PENALARAN MATEMATIKA"
        ];

        // ===== LOAD DATA DARI APPS SCRIPT =====
        async function loadData() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('tableContent').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');

            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getStatistikJurusan`);
                const result = await res.json();

                document.getElementById('loadingState').classList.add('hidden');

                if (result.success) {
                    allData = result.data || [];
                    renderData(allData);
                } else {
                    showError(result.message || 'Gagal memuat data');
                }
            } catch (err) {
                document.getElementById('loadingState').classList.add('hidden');
                showError('Gagal memuat data. Periksa koneksi atau URL Apps Script. Error: ' + err.message);
            }
        }

        function showError(msg) {
            const emptyState = document.getElementById('emptyState');
            emptyState.classList.remove('hidden');
            emptyState.innerHTML = `
                <i data-lucide="alert-circle" class="w-12 h-12 text-rose-300 mx-auto mb-3"></i>
                <p class="text-rose-600">${msg}</p>
            `;
            lucide.createIcons();
        }

        // ===== RENDER DATA KE TABEL =====
        function renderData(data) {
            const container = document.getElementById('rowsContainer');
            const tableContent = document.getElementById('tableContent');
            const emptyState = document.getElementById('emptyState');
            const resultCount = document.getElementById('resultCount');

            container.innerHTML = '';
            resultCount.textContent = `${data.length} jurusan`;

            if (data.length === 0) {
                tableContent.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.innerHTML = `
                    <div class="p-12 text-center">
                        <i data-lucide="search-x" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                        <p class="text-slate-500">Tidak ada data yang cocok dengan pencarian</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            tableContent.classList.remove('hidden');
            emptyState.classList.add('hidden');

            data.forEach((item, index) => {
                const avg = item.avg || {};
                const scoreKeys = Object.keys(avg).filter(k => avg[k] !== null);
                const avgTotal = scoreKeys.length > 0 
                    ? (scoreKeys.reduce((a, k) => a + parseFloat(avg[k]), 0) / scoreKeys.length).toFixed(2)
                    : '-';

                const row = document.createElement('div');
                row.className = 'accordion-row';
                row.dataset.id = index;

                row.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-12 gap-2 md:gap-4 px-4 md:px-5 py-4 hover:bg-slate-50 cursor-pointer transition-colors" onclick="toggleAccordion(${index})">
                        <div class="md:col-span-1 flex md:block items-center">
                            <span class="md:hidden text-xs text-slate-400 mr-2">No:</span>
                            <span class="text-sm font-semibold text-slate-500">${index + 1}</span>
                        </div>
                        <div class="md:col-span-3">
                            <span class="md:hidden text-xs text-slate-400">PTN: </span>
                            <span class="text-sm font-bold text-slate-900">${item.ptn || '-'}</span>
                        </div>
                        <div class="md:col-span-4">
                            <span class="md:hidden text-xs text-slate-400">Jurusan: </span>
                            <span class="text-sm text-slate-700 font-medium">${item.prodi || '-'}</span>
                        </div>
                        <div class="md:col-span-2">
                            <span class="md:hidden text-xs text-slate-400">Jenjang: </span>
                            <span class="inline-block px-2 py-1 rounded-md bg-slate-100 text-xs font-semibold text-slate-700">${item.jenjang || '-'}</span>
                        </div>
                        <div class="md:col-span-1 flex md:block items-center justify-start md:justify-center">
                            <span class="md:hidden text-xs text-slate-400 mr-2">Rata²:</span>
                            <span class="text-base md:text-lg font-bold text-emerald-600">${avgTotal}</span>
                        </div>
                        <div class="md:col-span-1 flex md:block items-center justify-end">
                            <button class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-lg transition-colors">
                                <span class="detail-text">Detail</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 rotate-icon detail-icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Detail Panel (Accordion) -->
                    <div class="accordion-detail bg-gradient-to-br from-slate-50 to-emerald-50/30 border-t border-slate-100" id="detail-${index}">
                        <div class="px-4 md:px-5 py-5">
                            <div class="flex items-center gap-2 mb-4">
                                <i data-lucide="bar-chart-2" class="w-5 h-5 text-primary"></i>
                                <h4 class="font-bold text-slate-900">Detail Skor per Subtes</h4>
                            </div>
                            
                            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3" id="subtes-grid-${index}">
                                <!-- Diisi oleh JavaScript -->
                            </div>

                            <div class="mt-4 pt-4 border-t border-slate-200 flex flex-wrap gap-4 text-xs text-slate-600">
                                <div class="flex items-center gap-2">
                                    <span class="w-3 h-3 rounded bg-emerald-500"></span>
                                    <span>Rata-rata skor subtes</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="w-3 h-3 rounded bg-rose-400"></span>
                                    <span>Skor terendah</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="w-3 h-3 rounded bg-blue-400"></span>
                                    <span>Skor tertinggi</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
            lucide.createIcons();
        }

        // ===== TOGGLE ACCORDION =====
        function toggleAccordion(index) {
            const detail = document.getElementById(`detail-${index}`);
            const row = document.querySelector(`.accordion-row[data-id="${index}"]`);
            const icon = row.querySelector('.detail-icon');
            const text = row.querySelector('.detail-text');

            if (expandedRow === index) {
                detail.classList.remove('open');
                icon.classList.remove('open');
                text.textContent = 'Detail';
                expandedRow = null;
                return;
            }

            // Tutup accordion sebelumnya jika ada
            if (expandedRow !== null) {
                const prevDetail = document.getElementById(`detail-${expandedRow}`);
                const prevRow = document.querySelector(`.accordion-row[data-id="${expandedRow}"]`);
                if (prevDetail) prevDetail.classList.remove('open');
                if (prevRow) {
                    prevRow.querySelector('.detail-icon').classList.remove('open');
                    prevRow.querySelector('.detail-text').textContent = 'Detail';
                }
            }

            detail.classList.add('open');
            icon.classList.add('open');
            text.textContent = 'Tutup';
            expandedRow = index;

            const grid = document.getElementById(`subtes-grid-${index}`);
            if (grid.children.length === 0) {
                renderSubtes(index);
            }
        }

        // ===== RENDER DETAIL SUBTES =====
        function renderSubtes(index) {
            const item = allData[index];
            const grid = document.getElementById(`subtes-grid-${index}`);
            
            const avg = item.avg || {};
            const min = item.min || {};
            const max = item.max || {};

            // Render sesuai URUTAN TETAP
            grid.innerHTML = URUTAN_SUBTES.map(subtesName => {
                const rawAvg = avg[subtesName];
                const rawMin = min[subtesName];
                const rawMax = max[subtesName];
                
                const avgDisplay = (rawAvg !== null && rawAvg !== undefined) ? rawAvg : "-";
                const minDisplay = (rawMin !== null && rawMin !== undefined) ? rawMin : "-";
                const maxDisplay = (rawMax !== null && rawMax !== undefined) ? rawMax : "-";

                return `
                    <div class="subtes-card bg-white rounded-xl p-3 border border-slate-200 shadow-sm">
                        <div class="text-xs text-slate-500 mb-2 font-medium leading-tight h-8 flex items-end">${subtesName}</div>
                        <div class="flex items-baseline gap-1 mb-2">
                            <span class="text-xl font-bold ${avgDisplay === '-' ? 'text-slate-400' : 'text-emerald-600'}">${avgDisplay}</span>
                            <span class="text-xs text-slate-400">rata²</span>
                        </div>
                        <div class="flex justify-between text-xs pt-2 border-t border-slate-100">
                            <div>
                                <div class="text-[10px] text-slate-400">Min</div>
                                <div class="font-semibold ${minDisplay === '-' ? 'text-slate-400' : 'text-rose-500'}">${minDisplay}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] text-slate-400">Max</div>
                                <div class="font-semibold ${maxDisplay === '-' ? 'text-slate-400' : 'text-blue-500'}">${maxDisplay}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== FILTER DATA =====
        function filterData() {
            const ptn = document.getElementById('searchPTN').value.toLowerCase();
            const prodi = document.getElementById('searchProdi').value.toLowerCase();
            const jenjang = document.getElementById('filterJenjang').value;

            const filtered = allData.filter(item => {
                const matchPTN = (item.ptn || '').toLowerCase().includes(ptn);
                const matchProdi = (item.prodi || '').toLowerCase().includes(prodi);
                const matchJenjang = jenjang ? item.jenjang === jenjang : true;
                return matchPTN && matchProdi && matchJenjang;
            });

            expandedRow = null;
            renderData(filtered);
        }

        // ===== EVENT LISTENERS =====
        ['searchPTN', 'searchProdi', 'filterJenjang'].forEach(id => {
            document.getElementById(id).addEventListener('input', filterData);
        });

        // Muat data saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
